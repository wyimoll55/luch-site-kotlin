# Сборка сайта на Kotlin/JS и публикация на GitHub Pages после каждого git push
name: Публикация сайта на Kotlin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle ставит само действие GitHub (с повторами при сбоях сети),
      # а не скрипт gradlew — на GitHub загрузка через gradlew обрывалась
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Сборка (Kotlin -> JavaScript)
        # при сбое сети пробуем ещё раз (до 3 попыток)
        run: |
          for i in 1 2 3; do
            gradle jsBrowserDistribution --no-daemon && exit 0
            echo "Попытка $i не удалась, повторяю через 20 секунд..."
            sleep 20
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/dist/js/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v4
